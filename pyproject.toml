[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resultseal"
version = "0.1.1"
description = "Deterministic observation-integrity contracts for AI-agent tool results"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ResultSeal contributors" }]
keywords = [
  "ai-agents",
  "llm",
  "mcp",
  "tool-calling",
  "determinism",
  "contract-testing",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = ["pyyaml>=6,<7"]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "build>=1.2,<2",
  # Test-only: validates shipped examples/fixtures against schemas/*.json
  # in tests/test_schemas.py. Never imported by src/.
  "jsonschema>=4,<5",
]

[project.scripts]
resultseal = "resultseal.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/resultseal"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
# PyYAML ships no type stubs; types-PyYAML is unavailable in this offline
# environment. safeio narrows the returned Any explicitly.
module = "yaml"
ignore_missing_imports = true
