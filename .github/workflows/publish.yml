name: Publish

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src

  build:
    runs-on: ubuntu-latest
    needs: gate
    environment: pypi
    permissions:
      # Required for trusted publishing to PyPI and creating the release.
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: Clean-install smoke (install the exact artifact, run it)
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install dist/*.whl
          /tmp/smoke-venv/bin/resultseal version
          /tmp/smoke-venv/bin/resultseal replay fixtures/*.yaml
          /tmp/smoke-venv/bin/python -c "import resultseal; resultseal.seal"
      - name: Tag matches package version
        run: |
          version="$(/tmp/smoke-venv/bin/resultseal version)"
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} does not match package version ${version}"; exit 1; }
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "no CHANGELOG entry for ${version}"; exit 1; }
      - name: Publish to PyPI via trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
