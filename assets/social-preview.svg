<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" fill="none" role="img" aria-labelledby="preview-title preview-description">
  <title id="preview-title">ResultSeal: Validate tool results before making claims</title>
  <desc id="preview-description">Python contracts for JSON, HTTP, MCP and stdio. Fail-closed checks, Python 3.11 or newer, one runtime dependency: PyYAML.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="65%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.16" />
      <stop offset="45%" stop-color="#4FACFE" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="50%" stop-color="#00D9F5" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="#090D16" />
  <rect width="1280" height="640" fill="url(#grid)" />
  <rect width="1280" height="640" fill="url(#bgGlow)" />
  <g transform="translate(100, 160)">
    <rect width="210" height="34" rx="17" fill="#0E1E2E" stroke="#00D9F5" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="16" cy="17" r="5" fill="#00F5A0" />
    <text x="28" y="22" fill="#00F5A0" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">TOOL RESULT CHECKS</text>
    <text y="106" fill="url(#textGradient)" font-family="Arial, sans-serif" font-size="80" font-weight="800" letter-spacing="-1.5">ResultSeal</text>
    <text y="146" fill="url(#accentGradient)" font-family="Arial, sans-serif" font-size="28" font-weight="600">Validate tool results before making claims.</text>
    <text y="196" fill="#94A3B8" font-family="Arial, sans-serif" font-size="18">Python contracts for JSON, HTTP, MCP and stdio.</text>
    <text y="224" fill="#94A3B8" font-family="Arial, sans-serif" font-size="18">Block empty, partial, stale and unverified observations.</text>
    <g transform="translate(0, 276)" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#E2E8F0">
      <rect width="148" height="34" rx="8" fill="#131B2E" stroke="#334155" />
      <text x="14" y="22">Fail-closed checks</text>
      <rect x="160" width="168" height="34" rx="8" fill="#131B2E" stroke="#334155" />
      <text x="174" y="22">Python 3.11+</text>
      <rect x="340" width="162" height="34" rx="8" fill="#131B2E" stroke="#334155" />
      <text x="354" y="22">One dependency</text>
    </g>
    <text y="360" fill="#94A3B8" font-family="Arial, sans-serif" font-size="18">github.com/sx4im/resultseal</text>
  </g>
  <!-- Keep the preview's mark in sync with the logo used by README and Pages. -->
  <image href="logo.png" x="650" y="20" width="600" height="600" />
</svg>
